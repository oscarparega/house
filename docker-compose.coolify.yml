services:
  database:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-house}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      POSTGRES_DB: ${POSTGRES_DB:-house}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-house}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}@database:5432/${POSTGRES_DB:-house}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-house}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}@database:5432/${POSTGRES_DB:-house}?schema=public
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      PUBLIC_WRITE_HASH_SECRET: ${PUBLIC_WRITE_HASH_SECRET:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_CREDIT_LIMIT_MONTHLY: ${FIRECRAWL_CREDIT_LIMIT_MONTHLY:-500}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMPORT_MODEL: ${OPENAI_IMPORT_MODEL:-gpt-5.6-luna}
      OPENAI_IMPORT_LIMIT_MONTHLY: ${OPENAI_IMPORT_LIMIT_MONTHLY:-100}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  import-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-house}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}@database:5432/${POSTGRES_DB:-house}?schema=public
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_CREDIT_LIMIT_MONTHLY: ${FIRECRAWL_CREDIT_LIMIT_MONTHLY:-500}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMPORT_MODEL: ${OPENAI_IMPORT_MODEL:-gpt-5.6-luna}
      OPENAI_IMPORT_LIMIT_MONTHLY: ${OPENAI_IMPORT_LIMIT_MONTHLY:-100}
    command: ["npm", "run", "worker:imports"]

volumes:
  postgres-data:
